<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست API - ایما</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
        
        .status.checking {
            background: #fff3cd;
            color: #856404;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        
        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .response {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-right: 4px solid #667eea;
            white-space: pre-wrap;
            line-height: 1.6;
            display: none;
        }
        
        .response.show {
            display: block;
        }
        
        .details {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
        }
        
        .details div {
            margin: 5px 0;
        }
        
        .code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 تست اتصال API ایما</h1>
        
        <div id="status" class="status checking">
            در حال بررسی اتصال...
        </div>
        
        <div class="input-group">
            <label for="question">سوال خود را بپرسید:</label>
            <input type="text" id="question" placeholder="مثال: 2+2 چند می‌شود؟" value="سلام! 2+2 چند می‌شود؟">
        </div>
        
        <button id="sendBtn" onclick="testAPI()">
            ارسال سوال
        </button>
        
        <div id="response" class="response"></div>
    </div>

    <script>
        // تنظیمات API
        const OPENROUTER_API_KEY = "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";
        const OPENROUTER_MODEL = "deepseek/deepseek-r1-0528:free";
        
        // بررسی اولیه
        window.addEventListener('load', async () => {
            const statusDiv = document.getElementById('status');
            
            try {
                // تست ساده
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: OPENROUTER_MODEL,
                        messages: [{
                            role: 'user',
                            content: 'سلام، فقط یک کلمه جواب بده: سلام'
                        }],
                        max_tokens: 50
                    })
                });
                
                if (response.ok) {
                    statusDiv.className = 'status success';
                    statusDiv.textContent = '✅ اتصال برقرار است - API کار می‌کند!';
                } else {
                    const errorData = await response.json();
                    throw new Error(JSON.stringify(errorData, null, 2));
                }
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = `❌ خطا در اتصال<br><small>${error.message}</small>`;
                console.error('Connection test failed:', error);
            }
        });
        
        // تابع تست API
        async function testAPI() {
            const questionInput = document.getElementById('question');
            const sendBtn = document.getElementById('sendBtn');
            const responseDiv = document.getElementById('response');
            const statusDiv = document.getElementById('status');
            
            const question = questionInput.value.trim();
            
            if (!question) {
                alert('لطفاً سوالی بنویسید!');
                return;
            }
            
            // غیرفعال کردن دکمه
            sendBtn.disabled = true;
            sendBtn.textContent = 'در حال ارسال...';
            
            // نمایش وضعیت
            statusDiv.className = 'status checking';
            statusDiv.textContent = '⏳ در حال پردازش...';
            
            // مخفی کردن پاسخ قبلی
            responseDiv.classList.remove('show');
            
            const startTime = Date.now();
            
            try {
                console.log('🚀 ارسال درخواست به OpenRouter...');
                console.log('📝 سوال:', question);
                console.log('🔑 API Key:', OPENROUTER_API_KEY.substring(0, 20) + '...');
                console.log('🤖 مدل:', OPENROUTER_MODEL);
                
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: OPENROUTER_MODEL,
                        messages: [
                            {
                                role: 'system',
                                content: 'You are a helpful math teacher. Always respond in Persian (Farsi) language.'
                            },
                            {
                                role: 'user',
                                content: question
                            }
                        ],
                        max_tokens: 1000,
                        temperature: 0.7
                    })
                });
                
                const endTime = Date.now();
                const duration = ((endTime - startTime) / 1000).toFixed(2);
                
                console.log('📡 پاسخ دریافت شد در', duration, 'ثانیه');
                console.log('📊 Status:', response.status);
                
                if (!response.ok) {
                    const errorData = await response.text();
                    console.error('❌ خطای API:', errorData);
                    throw new Error(`خطای HTTP ${response.status}: ${errorData}`);
                }
                
                const data = await response.json();
                console.log('✅ داده دریافت شد:', data);
                
                if (data.choices && data.choices[0]) {
                    const answer = data.choices[0].message.content;
                    
                    // نمایش پاسخ
                    statusDiv.className = 'status success';
                    statusDiv.textContent = `✅ پاسخ دریافت شد (${duration} ثانیه)`;
                    
                    responseDiv.innerHTML = `
                        <strong>پاسخ:</strong><br>
                        ${answer}
                        
                        <div class="details">
                            <div><strong>مدل:</strong> <span class="code">${OPENROUTER_MODEL}</span></div>
                            <div><strong>زمان پاسخ:</strong> ${duration} ثانیه</div>
                            <div><strong>تعداد توکن:</strong> ${data.usage?.total_tokens || 'نامشخص'}</div>
                        </div>
                    `;
                    responseDiv.classList.add('show');
                    
                } else {
                    throw new Error('پاسخی از API دریافت نشد');
                }
                
            } catch (error) {
                console.error('❌ خطا:', error);
                
                statusDiv.className = 'status error';
                statusDiv.textContent = '❌ خطا در دریافت پاسخ';
                
                responseDiv.innerHTML = `
                    <strong>خطا رخ داد:</strong><br>
                    ${error.message}
                    
                    <div class="details">
                        <div><strong>احتمالات:</strong></div>
                        <div>1. API key نامعتبر است</div>
                        <div>2. اتصال اینترنت قطع است</div>
                        <div>3. سرویس OpenRouter در دسترس نیست</div>
                        <div>4. CORS مسدود شده (از localhost استفاده کنید)</div>
                        <br>
                        <div><strong>راه حل:</strong></div>
                        <div>• Console مرورگر (F12) را بررسی کنید</div>
                        <div>• از یک وب سرور محلی استفاده کنید</div>
                        <div>• API key را بررسی کنید</div>
                    </div>
                `;
                responseDiv.classList.add('show');
            } finally {
                // فعال کردن دوباره دکمه
                sendBtn.disabled = false;
                sendBtn.textContent = 'ارسال سوال';
            }
        }
        
        // ارسال با Enter
        document.getElementById('question').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                testAPI();
            }
        });
    </script>
</body>
</html>
